\* TLC configuration: three agent slots (the root and two children), two names,
\* two worktrees, depth 2, two dispatch generations per slot, three sequence
\* numbers. Small enough for an exhaustive check, large enough for a child that
\* spawns a grandchild, an attenuated authority chain, a worktree lifecycle,
\* cancellation with cascade, a crash and reconciliation, and re-dispatch after
\* clear.
CONSTANTS
    Agents = {"r", "a1", "a2"}
    Root = "r"
    Names = {"n1", "n2"}
    Worktrees = {"w1", "w2"}
    MaxDepth = 2
    MaxGen = 2
    MaxSeq = 3
    NoAgent = "<no-agent>"
    NoName = "<no-name>"
    NoWorktree = "<no-worktree>"

SPECIFICATION Spec

INVARIANT ViewInv
PROPERTIES Liveness

\* The fixture can saturate its dispatch budget (nextSeq = MaxSeq or every slot
\* at MaxGen); the spec permits stuttering there, so deadlock checking is off.
CHECK_DEADLOCK FALSE
